services:
  app:
    container_name: sva_app
    build:
      context: .
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8002:8000"
    expose:
      - "8000"
    volumes:
      - .:/app
      - ./supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - svanetwork
      - beckn_network

networks:
  svanetwork:
    external: true
  beckn_network:
    external: true
